<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Bò Buồn - Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f6f8; padding: 20px; display: flex; justify-content: center; min-height: 100vh; color: #333; }
        .container { background: white; padding: 30px; border-radius: 16px; width: 100%; max-width: 500px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid #e1e4e8; height: fit-content; }
        h2 { color: #2c3e50; margin-bottom: 20px; border-bottom: 2px solid #e1e4e8; padding-bottom: 10px; font-size: 20px; font-weight: 600; }
        .order-card { background: #fafbfc; border: 1px solid #e1e4e8; padding: 20px; border-radius: 10px; margin-top: 15px; }
        .order-card div { margin-bottom: 10px; font-size: 15px; color: #444; }
        
        .status-pill { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; }
        .status-waiting { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .status-approved { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-rejected { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        
        .alert-new { background: #dc3545; color: white; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-left: 8px; animation: blink 1s infinite; }
        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.4;} 100% {opacity: 1;} }
        
        label { display: block; margin: 18px 0 6px; font-weight: 600; font-size: 14px; color: #555; }
        textarea { width: 100%; padding: 12px; border: 1px solid #ccd5ae; border-radius: 8px; font-size: 14px; resize: vertical; outline: none; }
        textarea:focus { border-color: #a3b18a; }
        
        .admin-actions { display: flex; gap: 12px; margin-top: 18px; }
        button { flex: 1; color: white; border: none; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn-approve { background: #28a745; } .btn-approve:hover { background: #218838; }
        .btn-reject { background: #dc3545; } .btn-reject:hover { background: #c82333; }
        .btn-clear { background: #6c757d; margin-top: 15px; width: 100%; }
        .btn-clear:hover { background: #5a6268; }
        
        .no-order { text-align: center; color: #777; padding: 30px; font-style: italic; font-size: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🛠️ Quản Lý Đơn Hàng - Bò Buồn</h2>
        <div id="admin-orders-container">
            <!-- Đơn hàng tự động hiển thị ở đây -->
        </div>
    </div>

    <script>
        // Biến kiểm tra xem admin có đang gõ chữ hay không
        let isAdminTyping = false;
        // Biến lưu trữ tạm nội dung chữ admin đang gõ dở
        let tempSavedMessage = "";

        function formatVND(amount) {
            return amount.toLocaleString('vi-VN') + '₫';
        }

        function renderAdminPanel() {
            // Nếu admin đang gõ chữ, chặn không cho vẽ lại giao diện từ luồng tự động kiểm tra để giữ bàn phím
            if (isAdminTyping) return;

            const container = document.getElementById('admin-orders-container');
            const currentOrder = JSON.parse(localStorage.getItem('currentOrder'));

            if (!currentOrder) {
                container.innerHTML = `<div class="no-order">Hiện tại chưa có lịch đặt nào.</div>`;
                return;
            }

            let statusClass = 'status-waiting';
            let statusText = 'Chờ duyệt';
            let alertBadge = '';
            
            if (currentOrder.status === 'pending') {
                statusText = 'Chờ duyệt';
                if(currentOrder.inCountdown) {
                    alertBadge = '<span class="alert-new">ĐƠN MỚI</span>';
                }
            } else if (currentOrder.status === 'approved') {
                statusClass = 'status-approved';
                statusText = 'Đã duyệt (Đã trừ tiền)';
            } else if (currentOrder.status === 'rejected') {
                statusClass = 'status-rejected';
                statusText = 'Đã hủy đơn';
            }

            let html = `
                <div class="order-card">
                    <div><strong>Trạng thái:</strong> <span class="status-pill ${statusClass}">${statusText}</span> ${alertBadge}</div>
                    <div><strong>Gói:</strong> ${currentOrder.cheeseName}</div>
                    <div><strong>Ngày làm:</strong> ${currentOrder.date}</div>
                    <div><strong>Thời gian:</strong> ${currentOrder.time}</div>
                    <div><strong>Thành tiền:</strong> <span style="color:#dc3545; font-weight:bold;">${formatVND(currentOrder.price)}</span></div>
            `;

            if (currentOrder.status === 'pending') {
                html += `
                    <label for="admin-reply-msg">Tin nhắn phản hồi gửi khách hàng:</label>
                    <textarea id="admin-reply-msg" rows="3" 
                        placeholder="Nhập lời dặn hoặc lý do từ chối..."
                        onfocus="startTyping()" 
                        onblur="stopTyping()"
                        oninput="saveTempText(this.value)">${tempSavedMessage}</textarea>
                    
                    <div class="admin-actions">
                        <button class="btn-approve" onclick="processOrder(true)">Duyệt Đơn</button>
                        <button class="btn-reject" onclick="processOrder(false)">Hủy Đơn</button>
                    </div>
                `;
            } else {
                if(currentOrder.adminMessage) {
                    html += `<div style="margin-top:15px; border-top: 1px dashed #ccc; padding-top:10px; font-style: italic; color: #555;"><strong>Tin nhắn đã gửi:</strong> "${currentOrder.adminMessage}"</div>`;
                }
                html += `<button class="btn-clear" onclick="clearOrder()">Xóa đơn cũ để nhận đơn mới</button>`;
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        // Các hàm xử lý giữ tiêu điểm bàn phím khi nhập liệu
        window.startTyping = function() {
            isAdminTyping = true;
        }

        window.stopTyping = function() {
            isAdminTyping = false;
        }

        window.saveTempText = function(val) {
            tempSavedMessage = val;
        }

        window.processOrder = function(isApproved) {
            const currentOrder = JSON.parse(localStorage.getItem('currentOrder'));
            if (!currentOrder) return;

            // Lấy tin nhắn từ biến lưu trữ tạm thời
            currentOrder.adminMessage = tempSavedMessage;
            currentOrder.inCountdown = false;
            
            // Trả lại trạng thái có thể render
            isAdminTyping = false;

            if (isApproved) {
                let balance = parseInt(localStorage.getItem('userBalance') || '1000000');
                if (balance >= currentOrder.price) {
                    balance -= currentOrder.price;
                    localStorage.setItem('userBalance', balance.toString());
                    currentOrder.status = 'approved';
                } else {
                    alert('Số dư tài khoản khách không đủ!');
                    return;
                }
            } else {
                currentOrder.status = 'rejected';
            }

            localStorage.setItem('currentOrder', JSON.stringify(currentOrder));
            tempSavedMessage = ""; // Reset tin nhắn tạm sau khi gửi xong
            renderAdminPanel();
        }

        window.clearOrder = function() {
            localStorage.removeItem('currentOrder');
            tempSavedMessage = "";
            isAdminTyping = false;
            renderAdminPanel();
        }

        // Đồng bộ hóa khi nhận tín hiệu thay đổi dữ liệu
        window.addEventListener('storage', function() {
            // Chỉ nạp lại giao diện nếu admin không gõ chữ
            if (!isAdminTyping) renderAdminPanel();
        });

        renderAdminPanel();
        setInterval(renderAdminPanel, 1000);
    </script>
</body>
</html>
